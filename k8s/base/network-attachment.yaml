# =============================================================================
# 5GNexusGuard — Multus Network Attachment Definition
#
# Creates a macvlan interface on the pod for WireGuard traffic.
# The pod gets two interfaces:
#   eth0    — normal pod network (dashboard :8443, gossip :9450)
#   wg-ext  — macvlan on host NIC (WireGuard UDP :51820)
#
# IMPORTANT: Update 'master' to match your actual host NIC name.
# Check with: ip link show | grep -v lo | grep UP
# =============================================================================
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: defenderlink-wireguard
  namespace: defenderlink
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "defenderlink-wireguard",
      "type": "macvlan",
      "master": "eth0",
      "mode": "bridge",
      "ipam": {
        "type": "static"
      }
    }

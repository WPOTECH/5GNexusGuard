# =============================================================================
# 5GNexusGuard — Configuration
# =============================================================================

quarkus.application.name=defenderlink-mesh
quarkus.application.version=1.0.0
# Serve frontend from root, API from /api
quarkus.http.enable-compression=true
# HTTP
quarkus.http.port=8443
quarkus.http.host=0.0.0.0
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:3000,http://localhost:5173

# Virtual Threads (JDK 24)
quarkus.virtual-threads.enabled=true

# =============================================================================
# Mesh Configuration
# =============================================================================

# Node identity
mesh.data-dir=${user.home}/.defenderlink
mesh.node.mode=full

# Ledger
mesh.ledger.data-dir=${mesh.data-dir}/ledger
mesh.ledger.block-interval-ms=5000
mesh.ledger.max-entries-per-block=100

# Licensing
mesh.license.key=${MESH_LICENSE_KEY:}
mesh.node.max-free=3
mesh.node.max-pro=25

# Gossip (UDP broadcast for LAN discovery)
mesh.gossip.port=9450
mesh.gossip.broadcast-interval-ms=5000
mesh.gossip.peer-timeout-ms=30000

# Consensus (Raft)
mesh.consensus.election-timeout-min-ms=2000
mesh.consensus.election-timeout-max-ms=4000
mesh.consensus.heartbeat-interval-ms=1000

# Disable Dev Services (no Docker needed)
quarkus.devservices.enabled=false

# Tunnel
mesh.tunnel.interface-prefix=dl
mesh.tunnel.subnet-prefix=10.200
mesh.tunnel.listen-port-start=51820
mesh.tunnel.mtu=1420
mesh.tunnel.keepalive=25

# Intercept proxy
mesh.proxy.bind-address=127.0.0.1

# Relay
mesh.relay.enabled=true
mesh.relay.port=9451

# Logging
quarkus.log.level=INFO
quarkus.log.category."com.defenderlink".level=DEBUG
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] %s%e%n

# ?? Tunnel negotiate ??????????????????????????????????????????????????????
# This node's public WireGuard endpoint (IP:port) ? override per machine
mesh.node.public-endpoint=${MESH_PUBLIC_ENDPOINT:127.0.0.1:51820}

# ?? Egress proxy port range (VM side, bound to tunnel interface IP) ???????
mesh.tunnel.egress-port-start=15100

# ?? Intercept proxy port range (Polaris side, bound to 127.0.0.1) ?????????
mesh.proxy.local-port-start=14000
mesh.proxy.local-port-range=1000

# Optional bounded Linux namespace deployment; restart required.
mesh.access.mode=${MESH_ACCESS_MODE:STANDARD}
mesh.native.service-id=${MESH_NATIVE_SERVICE_ID:unconfigured}
mesh.native.client-node-id=${MESH_NATIVE_CLIENT_NODE_ID:unconfigured}
mesh.native.lease-file=${MESH_NATIVE_LEASE_FILE:/run/defenderlink-native/lease.json}

# =============================================================================
# 5GNexusGuard — Docker Build & Push to DockerHub
#
# Triggers:
#   - Push a version tag: git tag v1.0.0 && git push origin v1.0.0
#   - Manual dispatch from GitHub Actions UI
#
# Required GitHub Secrets:
#   DOCKERHUB_USERNAME  — your DockerHub username (wpotech)
#   DOCKERHUB_TOKEN     — DockerHub access token (not password)
#                         Create at: https://hub.docker.com/settings/security
# =============================================================================
name: Docker Build & Push

on:
  push:
    tags:
      - 'v*.*.*'          # Trigger on version tags: v1.0.0, v1.2.3, etc.
  workflow_dispatch:       # Allow manual trigger from GitHub UI
    inputs:
      tag:
        description: 'Image tag to push (e.g. 1.0.0)'
        required: false
        default: 'latest'

env:
  IMAGE_NAME: wpospace/defenderlink-mesh

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # ── Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Set up Java ───────────────────────────────────────────────────
      - name: Set up Java 24
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'temurin'
          cache: maven

      # ── Set up Node (for frontend build) ─────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # ── Build frontend ────────────────────────────────────────────────
      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..
          mkdir -p src/main/resources/META-INF/resources
          cp -r frontend/dist/* src/main/resources/META-INF/resources/

      # ── Build Quarkus uber-jar ────────────────────────────────────────
      - name: Build Quarkus uber-jar
        run: |
          mvn clean package -DskipTests \
            -Dquarkus.package.jar.type=uber-jar \
            -q
          # Rename for predictable path in Dockerfile
          find target -name "*-runner.jar" | head -1 | \
            xargs -I{} cp {} target/defenderlink-mesh-runner.jar
          echo "Built: $(ls -lh target/defenderlink-mesh-runner.jar)"

      # ── Extract version from tag ──────────────────────────────────────
      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"   # strip leading 'v'
          else
            VERSION="${{ github.event.inputs.tag || 'latest' }}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Image version: ${VERSION}"

      # ── Set up Docker Buildx ──────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Login to DockerHub ────────────────────────────────────────────
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── Build and push multi-arch image ──────────────────────────────
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.title=5GNexusGuard
            org.opencontainers.image.description=Decentralized Zero Trust Overlay Network
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Update DockerHub description ──────────────────────────────────
      - name: Update DockerHub description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE_NAME }}
          short-description: "Decentralized Zero Trust Overlay Network — No controller, no cloud, no SPOF"
          readme-filepath: ./README.md
